[project]
name = "parley-bridge-workspace"
version = "0.1.0"
description = "The Parley bridge and the package it depends on: what a tester installs beside their assistant."
requires-python = ">=3.12,<3.13"
dependencies = [
    "parley-common",
    "parley-bridge",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.uv]
package = false
# Every registry package pinned to the exact version the private repository's uv.lock
# resolved at commit c86e4c1212092fc238b541b1f6ff76fd0ce5e6b8; uv.lock is generated from these pins (T-0029).
constraint-dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "ast-serialize==0.12.1",
    "attrs==26.1.0",
    "cbor2==6.1.5",
    "certifi==2026.7.22",
    "cffi==2.1.1",
    "click==8.5.0",
    "colorama==0.4.6",
    "cryptography==50.0.2",
    "fastapi==0.142.2",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httptools==0.8.0",
    "httpx==0.28.1",
    "httpx-sse==0.4.3",
    "idna==3.20",
    "iniconfig==2.3.0",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "librt==0.16.0",
    "mcp==1.30.0",
    "mypy==2.4.0",
    "mypy-extensions==1.1.0",
    "opentelemetry-api==1.45.0",
    "packaging==26.3",
    "pathspec==1.1.1",
    "pluggy==1.6.0",
    "pyasn1==0.6.4",
    "pyasn1-modules==0.4.2",
    "pycparser==3.0",
    "pydantic==2.13.5",
    "pydantic-core==2.46.5",
    "pydantic-settings==2.15.0",
    "pygments==2.21.0",
    "pyjwt==2.15.1",
    "pynacl==1.6.2",
    "pyopenssl==26.4.0",
    "pytest==9.1.1",
    "python-dotenv==1.2.4",
    "python-multipart==0.0.32",
    "pywin32==312",
    "pyyaml==6.0.3",
    "referencing==0.37.0",
    "rpds-py==2026.9.1",
    "ruff==0.16.10",
    "sse-starlette==3.5.0",
    "starlette==1.7.0",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "uvicorn==0.54.0",
    "uvloop==0.23.0",
    "watchfiles==1.3.0",
    "webauthn==3.0.1",
    "websockets==17.2",
]

[tool.uv.workspace]
members = ["packages/common", "services/bridge"]

[tool.uv.sources]
parley-common = { workspace = true }
parley-bridge = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages/common/tests", "services/bridge/tests"]
addopts = "-q"
