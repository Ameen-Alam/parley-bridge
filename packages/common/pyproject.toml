[project]
name = "parley-common"
version = "0.1.0"
description = "Shared code for Parley: envelope schema, signing, IDs, time."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pynacl>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parley_common"]
